[workspace]
resolver = "3"
members = [
    "crates/voip-core",
    "crates/voip-signaling",
    "crates/voip-client",
    "crates/voip-dht",
    "crates/voip-ffi",
    "crates/voip-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/topic-hash/three-pillars-voip"

[workspace.dependencies]
# QUIC
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
futures = "0.3"

# Protobuf
prost = "0.13"
prost-types = "0.13"

# HTTP/3 + MASQUE
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"

# Signaling server
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tokio-tungstenite = "0.26"

# DHT
libp2p = { version = "0.56", features = ["kad", "noise", "tcp", "quic", "websocket", "tls", "dns", "ping", "identify", "tokio"] }

# Audio
opus = "0.3"

# Push notifications
# fcmlib is for FCM plotter files, not Firebase — we use fcm crate or REST API instead

# TLS cert provisioning (proxy)
rustls-acme = "0.12"

# UniFFI
uniffi = "0.31"

# Crypto
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Caching
lru = "0.12"

# Error handling
thiserror = "2"
anyhow = "1"

# Build
prost-build = "0.13"

# Testing
tokio-test = "0.4"
